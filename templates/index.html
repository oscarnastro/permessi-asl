<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richiesta di Congedo/Permesso – ASL</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Permessi ASL" />
  <meta name="application-name" content="Permessi ASL" />
  <meta name="msapplication-TileColor" content="#4f46e5" />
  <meta name="msapplication-TileImage" content="/static/icons/icon-144x144.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />

  <!-- Duet Date Picker -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@duetds/date-picker@1.4.0/dist/duet/themes/default.css"
        integrity="sha384-49HNOBJJyd49ScV2OWrqBXajgjMjZDZ4mNTy5Nlr05z+sT0MoGu161j1GkEBvT0P"
        crossorigin="anonymous" />
  <script type="module"
          src="https://cdn.jsdelivr.net/npm/@duetds/date-picker@1.4.0/dist/duet/duet.esm.js"
          integrity="sha384-f/at0X+t6h5Pbz7pUbo3fxfnLYcsqvRUlNxXmKeg9RTKUMZabWMyigINsgQBD/kl"
          crossorigin="anonymous"></script>
  <script nomodule
          src="https://cdn.jsdelivr.net/npm/@duetds/date-picker@1.4.0/dist/duet/duet.js"
          integrity="sha384-aoJaHSZ8l+yXP+KcHxUZgsjAxYvsdXbf2lEQWMeq+vaiM8mdRhH+KcCH03T5/k5b"
          crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .radio-card input[type="radio"]:checked + label {
      border-color: #4f46e5;
      background-color: #eef2ff;
      color: #3730a3;
    }
    .radio-card input[type="radio"]:focus-visible + label {
      outline: 3px solid #4f46e5;
      outline-offset: 2px;
    }

    /* Theme Duet Date Picker with the indigo palette */
    :root {
      --duet-color-primary: #4f46e5;
      --duet-color-text: #1f2937;
      --duet-color-text-active: #ffffff;
      --duet-color-placeholder: #9ca3af;
      --duet-color-button: #f3f4f6;
      --duet-color-surface: #ffffff;
      --duet-color-overlay: rgba(0, 0, 0, 0.6);
      --duet-color-border: #e5e7eb;
      --duet-font: inherit;
      --duet-font-normal: 400;
      --duet-font-bold: 600;
      --duet-radius: 0.75rem;
      --duet-z-index: 600;
    }

    /* Match input style to the rest of the form */
    .duet-date__input {
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #e5e7eb;
      color: #1f2937;
      font-size: 1rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .duet-date__input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .duet-date__toggle {
      border-radius: 0 0.75rem 0.75rem 0;
    }
    .duet-date[data-invalid] .duet-date__input {
      border-color: #ef4444;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-10 px-4">

  <!-- Header -->
  <header class="max-w-2xl mx-auto mb-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-600 mb-4 shadow-lg">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <h1 class="text-3xl font-bold text-indigo-900">Richiesta di Congedo e/o Permesso</h1>
    <p class="mt-2 text-indigo-600 text-sm">Compila il modulo per generare e inviare la tua richiesta</p>
  </header>

  <!-- Live region for screen readers -->
  <div id="live-region" role="alert" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

  <!-- Alert visible -->
  <div id="alert-box" class="max-w-2xl mx-auto mb-6 hidden" role="status" aria-live="polite">
    <div id="alert-inner" class="rounded-lg p-4 text-sm font-medium flex items-start gap-3"></div>
  </div>

  <!-- Card -->
  <main class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form id="permesso-form" role="form" aria-label="Modulo richiesta permesso" novalidate>

        <!-- Tipo permesso -->
        <fieldset class="mb-8">
          <legend class="text-lg font-semibold text-gray-800 mb-4">
            Tipo di permesso
            <span class="text-red-500 ml-1" aria-label="obbligatorio">*</span>
          </legend>
          <div id="tipo-error" role="alert" class="hidden text-red-600 text-sm mb-3 flex items-center gap-1">
            <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span id="tipo-error-msg"></span>
          </div>
          <div class="space-y-3" id="tipo-group">

            <div class="radio-card">
              <input type="radio" name="tipo_permesso" id="tipo-congedo" value="congedo"
                     aria-describedby="tipo-error" class="sr-only" />
              <label for="tipo-congedo"
                     class="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer transition-all hover:border-indigo-300 hover:bg-indigo-50">
                <span class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                  <span class="w-2.5 h-2.5 rounded-full bg-current hidden check-dot"></span>
                </span>
                <span class="font-medium">Congedo ordinario</span>
              </label>
            </div>

            <div class="radio-card">
              <input type="radio" name="tipo_permesso" id="tipo-festivita" value="festivita"
                     aria-describedby="tipo-error" class="sr-only" />
              <label for="tipo-festivita"
                     class="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer transition-all hover:border-indigo-300 hover:bg-indigo-50">
                <span class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                  <span class="w-2.5 h-2.5 rounded-full bg-current hidden check-dot"></span>
                </span>
                <span class="font-medium">Festività soppresse</span>
              </label>
            </div>

            <div class="radio-card">
              <input type="radio" name="tipo_permesso" id="tipo-104" value="104"
                     aria-describedby="tipo-error" class="sr-only" />
              <label for="tipo-104"
                     class="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer transition-all hover:border-indigo-300 hover:bg-indigo-50">
                <span class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                  <span class="w-2.5 h-2.5 rounded-full bg-current hidden check-dot"></span>
                </span>
                <span class="font-medium">104/95 art. 3</span>
              </label>
            </div>

            <div class="radio-card">
              <input type="radio" name="tipo_permesso" id="tipo-legge" value="legge"
                     aria-describedby="tipo-error" class="sr-only" />
              <label for="tipo-legge"
                     class="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer transition-all hover:border-indigo-300 hover:bg-indigo-50">
                <span class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                  <span class="w-2.5 h-2.5 rounded-full bg-current hidden check-dot"></span>
                </span>
                <span class="font-medium text-sm">Legge Permesso art. 54 (ex 40 – prestazioni specialistiche / esami diagnostici)</span>
              </label>
            </div>

            <div class="radio-card">
              <input type="radio" name="tipo_permesso" id="tipo-altro" value="altro"
                     aria-describedby="tipo-error" class="sr-only" />
              <label for="tipo-altro"
                     class="flex items-center gap-3 p-4 rounded-xl border-2 border-gray-200 cursor-pointer transition-all hover:border-indigo-300 hover:bg-indigo-50">
                <span class="w-5 h-5 rounded-full border-2 border-current flex-shrink-0 flex items-center justify-center">
                  <span class="w-2.5 h-2.5 rounded-full bg-current hidden check-dot"></span>
                </span>
                <span class="font-medium">Altro</span>
              </label>
            </div>

          </div>
        </fieldset>

        <!-- Date range -->
        <div class="mb-8">
          <h2 class="text-lg font-semibold text-gray-800 mb-4">Periodo richiesto</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Dal -->
            <div>
              <duet-date-picker
                identifier="data_dal"
                name="data_dal"
                label="Dal"
                required
                aria-describedby="dal-error"
              ></duet-date-picker>
              <div id="dal-error" role="alert" class="hidden text-red-600 text-xs mt-1 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span id="dal-error-msg"></span>
              </div>
            </div>

            <!-- Al -->
            <div>
              <duet-date-picker
                identifier="data_al"
                name="data_al"
                label="Al"
                required
                aria-describedby="al-error"
              ></duet-date-picker>
              <div id="al-error" role="alert" class="hidden text-red-600 text-xs mt-1 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                </svg>
                <span id="al-error-msg"></span>
              </div>
            </div>
          </div>

          <!-- Giorni calcolati -->
          <div id="giorni-display" class="hidden mt-4 p-3 bg-green-50 rounded-xl border border-green-200 text-green-800 text-sm font-medium text-center">
            📅 Totale: <span id="giorni-count" class="font-bold text-green-900"></span> giorno/i
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-6 rounded-xl transition-all shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-300 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
          <svg id="btn-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
          <svg id="btn-spinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          <span id="btn-text">Genera e Invia Permesso</span>
        </button>

      </form>
    </div>
  </main>

  <footer class="max-w-2xl mx-auto mt-8 text-center text-xs text-indigo-400">
    © ASL – Sistema di gestione permessi e congedi
  </footer>

  <script>
    const form = document.getElementById('permesso-form');
    const giorni = document.getElementById('giorni-display');
    const giorniCount = document.getElementById('giorni-count');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const btnSpinner = document.getElementById('btn-spinner');
    const alertBox = document.getElementById('alert-box');
    const alertInner = document.getElementById('alert-inner');
    const liveRegion = document.getElementById('live-region');

    // ISO date values kept in sync via duetChange events
    let dataDalValue = '';
    let dataAlValue = '';

    // Italian localization for Duet Date Picker
    const itLocalization = {
      buttonLabel: 'Scegli data',
      placeholder: 'gg/mm/aaaa',
      selectedDateMessage: 'La data selezionata è',
      prevMonthLabel: 'Mese precedente',
      nextMonthLabel: 'Mese successivo',
      monthSelectLabel: 'Mese',
      yearSelectLabel: 'Anno',
      closeLabel: 'Chiudi il calendario',
      keyboardInstruction: 'Puoi usare i tasti freccia per navigare le date',
      calendarHeading: 'Scegli una data',
      dayNames: ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'],
      monthNames: [
        'Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
        'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre',
      ],
      monthNamesShort: [
        'Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu',
        'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic',
      ],
      locale: 'it-IT',
      dateAdapter: {
        parse(value) {
          // Accept ISO yyyy-mm-dd or Italian dd/mm/yyyy and dd-mm-yyyy
          if (!value) return undefined;
          const isoMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
          if (isoMatch) {
            const year  = parseInt(isoMatch[1], 10);
            const month = parseInt(isoMatch[2], 10);
            const day   = parseInt(isoMatch[3], 10);
            if (month < 1 || month > 12 || day < 1 || day > 31) return undefined;
            const d = new Date(year, month - 1, day);
            if (d.getFullYear() !== year || d.getMonth() + 1 !== month || d.getDate() !== day) return undefined;
            return d;
          }
          const itMatch = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(value);
          if (itMatch) {
            const day   = parseInt(itMatch[1], 10);
            const month = parseInt(itMatch[2], 10);
            const year  = parseInt(itMatch[3], 10);
            if (month < 1 || month > 12 || day < 1 || day > 31) return undefined;
            const d = new Date(year, month - 1, day);
            if (d.getFullYear() !== year || d.getMonth() + 1 !== month || d.getDate() !== day) return undefined;
            return d;
          }
          return undefined;
        },
        format(date) {
          const dd = String(date.getDate()).padStart(2, '0');
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const yyyy = date.getFullYear();
          return `${dd}/${mm}/${yyyy}`;
        },
      },
    };

    // Milliseconds to wait for the CDN scripts before falling back to native inputs.
    // 5 s gives room for slow connections while not delaying the fallback indefinitely.
    const CDN_TIMEOUT_MS = 5000;

    // Race: apply localization and wire per-element duetChange listeners as soon as
    // the component is defined, but give up after CDN_TIMEOUT_MS and fall back.
    let cdnFailed = false;
    const pickerReadyPromise = customElements.whenDefined('duet-date-picker');
    const cdnTimeoutPromise  = new Promise(resolve => setTimeout(() => { cdnFailed = true; resolve(); }, CDN_TIMEOUT_MS));

    Promise.race([pickerReadyPromise, cdnTimeoutPromise]).then(() => {
      if (cdnFailed) {
        // Timeout won the race — activate native input fallback
        activateFallbackInputs();
        return;
      }
      const pickerDal = document.querySelector('duet-date-picker[identifier="data_dal"]');
      const pickerAl  = document.querySelector('duet-date-picker[identifier="data_al"]');
      if (pickerDal) {
        pickerDal.localization = itLocalization;
        pickerDal.addEventListener('duetChange', (e) => {
          dataDalValue = e.detail.value || '';
          clearFieldError('dal');
          calcGiorni();
        });
      }
      if (pickerAl) {
        pickerAl.localization = itLocalization;
        pickerAl.addEventListener('duetChange', (e) => {
          dataAlValue = e.detail.value || '';
          clearFieldError('al');
          calcGiorni();
        });
      }
    });

    function activateFallbackInputs() {
      document.querySelectorAll('duet-date-picker').forEach(picker => {
        const id    = picker.getAttribute('identifier');
        const label = picker.getAttribute('label') || id;
        const errId = id === 'data_dal' ? 'dal-error' : 'al-error';

        // Build label element safely (no innerHTML) to avoid XSS
        const labelEl = document.createElement('label');
        labelEl.htmlFor = id;
        labelEl.className = 'block text-sm font-medium text-gray-700 mb-1';
        labelEl.textContent = label + ' ';
        const reqSpan = document.createElement('span');
        reqSpan.className = 'text-red-500 ml-1';
        reqSpan.setAttribute('aria-label', 'obbligatorio');
        reqSpan.textContent = '*';
        labelEl.appendChild(reqSpan);

        const input = document.createElement('input');
        input.type = 'date';
        input.id   = id;
        input.name = id;
        input.setAttribute('aria-required', 'true');
        input.setAttribute('aria-describedby', errId);
        input.className = 'w-full px-4 py-2.5 rounded-xl border-2 border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-gray-800';

        picker.replaceWith(labelEl, input);
      });
      const fallbackDal = document.getElementById('data_dal');
      const fallbackAl  = document.getElementById('data_al');
      if (fallbackDal) {
        fallbackDal.addEventListener('change', () => {
          dataDalValue = fallbackDal.value;
          calcGiorni();
          clearFieldError('dal');
        });
      }
      if (fallbackAl) {
        fallbackAl.addEventListener('change', () => {
          dataAlValue = fallbackAl.value;
          calcGiorni();
          clearFieldError('al');
        });
      }
    }

    function getSelectedTipo() {
      const checked = document.querySelector('input[name="tipo_permesso"]:checked');
      return checked ? checked.value : null;
    }

    function updateCheckDots() {
      document.querySelectorAll('.radio-card').forEach(card => {
        const input = card.querySelector('input[type="radio"]');
        const dot = card.querySelector('.check-dot');
        if (dot) dot.classList.toggle('hidden', !input.checked);
      });
    }

    function calcGiorni() {
      if (dataDalValue && dataAlValue) {
        const d1 = new Date(dataDalValue);
        const d2 = new Date(dataAlValue);
        const diff = Math.round((d2 - d1) / 86400000) + 1;
        if (diff > 0) {
          giorniCount.textContent = diff;
          giorni.classList.remove('hidden');
          return;
        }
      }
      giorni.classList.add('hidden');
    }

    function showFieldError(fieldId, msg) {
      const errDiv = document.getElementById(fieldId + '-error');
      const errMsg = document.getElementById(fieldId + '-error-msg');
      if (errDiv && errMsg) {
        errMsg.textContent = msg;
        errDiv.classList.remove('hidden');
      }
    }

    function clearFieldError(fieldId) {
      const errDiv = document.getElementById(fieldId + '-error');
      if (errDiv) errDiv.classList.add('hidden');
    }

    function clearAllErrors() {
      ['tipo', 'dal', 'al'].forEach(clearFieldError);
    }

    function showAlert(ok, message) {
      const isOk = ok;
      alertInner.className = isOk
        ? 'rounded-lg p-4 text-sm font-medium flex items-start gap-3 bg-green-50 text-green-800 border border-green-200'
        : 'rounded-lg p-4 text-sm font-medium flex items-start gap-3 bg-red-50 text-red-800 border border-red-200';
      alertInner.innerHTML = isOk
        ? `<svg class="w-5 h-5 flex-shrink-0 text-green-500" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg><span>${message}</span>`
        : `<svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg><span>${message}</span>`;
      alertBox.classList.remove('hidden');
      liveRegion.textContent = message;
      alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.textContent = loading ? 'Elaborazione in corso...' : 'Genera e Invia Permesso';
      btnIcon.classList.toggle('hidden', loading);
      btnSpinner.classList.toggle('hidden', !loading);
    }

    function clientValidate() {
      clearAllErrors();
      const tipo = getSelectedTipo();
      let valid = true;

      if (!tipo) {
        showFieldError('tipo', 'Seleziona il tipo di permesso.');
        valid = false;
      }

      if (!dataDalValue) {
        showFieldError('dal', 'La data di inizio è obbligatoria.');
        valid = false;
      }
      if (!dataAlValue) {
        showFieldError('al', 'La data di fine è obbligatoria.');
        valid = false;
      }
      if (dataDalValue && dataAlValue && dataAlValue < dataDalValue) {
        showFieldError('al', 'La data di fine deve essere uguale o successiva alla data di inizio.');
        valid = false;
      }

      return valid;
    }

    document.querySelectorAll('input[name="tipo_permesso"]').forEach(radio => {
      radio.addEventListener('change', () => {
        updateCheckDots();
        calcGiorni();
        clearFieldError('tipo');
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      liveRegion.textContent = '';

      if (!clientValidate()) {
        const firstError = document.querySelector('[id$="-error"]:not(.hidden)');
        if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      setLoading(true);

      const payload = {
        tipo_permesso: getSelectedTipo(),
        data_dal: dataDalValue,
        data_al: dataAlValue,
      };

      try {
        const resp = await fetch('/genera', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const json = await resp.json();

        if (json.ok) {
          showAlert(true, json.message || 'Permesso generato e inviato con successo!');
          form.reset();
          updateCheckDots();
          giorni.classList.add('hidden');
          clearAllErrors();
          // Clear Duet pickers
          dataDalValue = '';
          dataAlValue = '';
          const pickerDal = document.querySelector('duet-date-picker[identifier="data_dal"]');
          const pickerAl  = document.querySelector('duet-date-picker[identifier="data_al"]');
          if (pickerDal) pickerDal.value = '';
          if (pickerAl)  pickerAl.value  = '';
        } else {
          const errors = json.errors || {};
          if (errors.tipo_permesso) showFieldError('tipo', errors.tipo_permesso);
          if (errors.data_dal) showFieldError('dal', errors.data_dal);
          if (errors.data_al) showFieldError('al', errors.data_al);
          const msg = errors.general || 'Si è verificato un errore. Riprova.';
          showAlert(false, msg);
        }
      } catch (err) {
        showAlert(false, 'Errore di rete. Controlla la connessione e riprova.');
      } finally {
        setLoading(false);
      }
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' });
      });
    }
  </script>
</body>
</html>
